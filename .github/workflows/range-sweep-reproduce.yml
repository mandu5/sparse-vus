name: Exact range metric reproduction

on:
  push:
    branches: [research/pvldb-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[range-reproduce]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.4"
      - name: Install pinned numerical dependencies
        run: >-
          python -m pip install numpy==1.26.4 numba==0.59.1
          pandas==3.0.1 scikit-learn==1.8.0 scipy==1.17.1
          threadpoolctl==3.6.0 statsmodels==0.14.6
      - name: Install CPU public comparator dependency
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Fresh source-to-table execution
        run: python experiments/reproduce_range_sweep.py --output "$RUNNER_TEMP/range-replica"
      - name: Archive complete evidence and generated scores
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-sweep-linux
          path: |
            ${{ runner.temp }}/range-replica/artifacts/pvldb-research-20261024
            ${{ runner.temp }}/range-replica/.cache/pvldb-full-precision-20261024
            ${{ runner.temp }}/range-replica/.cache/tsbad-consumer/pkg
            ${{ runner.temp }}/range-replica/.cache/range-sweep-timesead
            ${{ runner.temp }}/range-replica/.cache/fast_vus
            ${{ runner.temp }}/range-replica/.cache/benchopt_vus
          include-hidden-files: true
          if-no-files-found: error
