name: PVLDB full-precision reproduction

on:
  push:
    branches: [research/pvldb-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pvldb-reproduce]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.4"
      - name: Install the recorded numerical environment
        run: >-
          python -m pip install numpy==1.26.4 numba==0.59.1
          pandas==3.0.1 scikit-learn==1.8.0 scipy==1.17.1 threadpoolctl==3.6.0
      - name: Execute a fresh isolated reproduction
        run: >-
          python experiments/reproduce_pvldb20261024.py
          --output "$RUNNER_TEMP/pvldb-replica"
          --host-note "One serial process on a public hosted x86 runner; shared host load is not controlled. Compilation excluded equally; no GPU or paid API."
      - name: Retain complete evidence and any failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pvldb-full-precision-linux
          path: ${{ runner.temp }}/pvldb-replica/artifacts/pvldb-research-20261024
          if-no-files-found: error
