name: Independent x86 research benchmark

on:
  push:
    branches: [research/certified-width-20261020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install '.[accelerate,research]'
      - run: python experiments/fast_vus_adapter.py --fetch
      - run: python experiments/fetch_score_ranges.py
      - name: Whole-call paired timings
        run: >-
          python experiments/benchmark_advancement.py --mode baseline
          --output artifacts/advancement/linux-baseline
          --cpu-clearance "Dedicated public GitHub Actions job; no concurrent steps;
          hosted hardware and background host load are not under our control."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-exact-baseline
          path: artifacts/advancement/linux-baseline
          if-no-files-found: error
