name: Numerical parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sampling-report-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dispatch: [default, baseline]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Compare frozen report bytes and capture numerical dispatch
        env:
          NPY_DISABLE_CPU_FEATURES: ${{ matrix.dispatch == 'baseline' && 'X86_V3,X86_V4' || '' }}
        run: |
          python experiments/diagnose_sampling_report_portability.py \
            --output "$RUNNER_TEMP/report-portability.json"
      - name: Preserve exact differences even if replay fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sampling-report-portability-${{ matrix.dispatch }}
          path: ${{ runner.temp }}/report-portability.json
          if-no-files-found: error
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[accelerate,research]'
      - run: python experiments/fetch_reference.py
      - run: python experiments/dtaianomaly_adapter.py --fetch
      - run: python experiments/fast_vus_adapter.py --fetch
      - run: python experiments/benchopt_vus_adapter.py --fetch
      - run: python -m pytest -q
      - name: Verify the certified-sampling evidence without raw input caches
        if: matrix.python == '3.12'
        run: |
          python experiments/audit_certified_sampling_bundle.py \
            --output "$RUNNER_TEMP/certified-sampling-audit.json"
          PYTHONPATH=src python experiments/msad_sampling_study.py report
      - name: Upload the certified-sampling audit
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-certified-sampling-evidence
          path: ${{ runner.temp }}/certified-sampling-audit.json
          if-no-files-found: error
      - name: Reconstruct frozen active-prefix evidence without input caches
        if: matrix.python == '3.12'
        run: |
          python experiments/summarize_saturation_evidence.py \
            --study Mac-development=artifacts/saturation/mac-development \
            --study Mac-external=artifacts/saturation/mac-external \
            --study Linux-external=artifacts/reproductions/linux-saturation-39546569039/benchmark \
            --output "$RUNNER_TEMP/active-prefix-evidence"
          python experiments/benchmark_saturation_structural.py report artifacts/saturation/mac-structural
          python experiments/audit_saturation_supplement.py \
            --output "$RUNNER_TEMP/active-prefix-evidence/supplement.json"
          python experiments/audit_tie_runs.py \
            > "$RUNNER_TEMP/active-prefix-evidence/tie-run-independent.json"
          python experiments/benchmark_tie_runs.py report \
            --output artifacts/tie-runs/mac-20261023 \
            > "$RUNNER_TEMP/active-prefix-evidence/tie-run-recorded.json"
          python experiments/audit_vus_collection.py \
            artifacts/collection-workflow/mac-20261023 \
            --protocol-sha256 69ee646b505297e0feb124cb3206b0d600a6ad2a0a021c8fcea1c195dd4f56ea \
            --output "$RUNNER_TEMP/active-prefix-evidence/collection-workflow.json"
      - name: Upload reconstructed active-prefix evidence
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-active-prefix-evidence
          path: ${{ runner.temp }}/active-prefix-evidence/*
          if-no-files-found: error
      - name: Verify the real v2 report against its preserved source snapshot
        if: matrix.python == '3.12'
        run: |
          ln -s "$GITHUB_WORKSPACE/.cache" artifacts/pr-engine/source-v2/.cache
          python experiments/report_pr_engine.py artifacts/pr-engine/mac-development --output "$RUNNER_TEMP/pr-engine-v2-report/report" --tex
      - name: Upload the verified v2 report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-pr-engine-v2-report
          path: ${{ runner.temp }}/pr-engine-v2-report/report.*
          if-no-files-found: error
      - name: Verify the completed Linux v3 holdout report
        if: matrix.python == '3.12'
        run: |
          linux_run=artifacts/reproductions/linux-pr-engine-39523992616
          for receipt in protocol.json inputs.json environment.json measurements.jsonl summary.json audit.json; do
            test -f "$linux_run/$receipt"
          done
          python experiments/report_pr_engine.py "$linux_run" --output "$RUNNER_TEMP/pr-engine-linux-report/report" --tex
      - name: Upload the verified Linux v3 holdout report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-pr-engine-linux-report
          path: ${{ runner.temp }}/pr-engine-linux-report/report.*
          if-no-files-found: error
      - name: Verify the completed Mac v3 holdout report
        if: matrix.python == '3.12'
        run: |
          python experiments/report_pr_engine.py artifacts/pr-engine/mac-holdout --output "$RUNNER_TEMP/pr-engine-mac-report/report" --tex
      - name: Upload the verified Mac v3 holdout report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-pr-engine-mac-report
          path: ${{ runner.temp }}/pr-engine-mac-report/report.*
          if-no-files-found: error
      # No model weights, large score archive, GPU, or paid API are required.
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/sparse-vus-wheel-check
      - run: /tmp/sparse-vus-wheel-check/bin/python -m pip install dist/*.whl
      - name: Verify the installed base package without optional Numba
        run: /tmp/sparse-vus-wheel-check/bin/python experiments/check_installed_package.py
      - name: Install the accelerated wheel in a separate environment
        run: |
          python -m venv /tmp/sparse-vus-accelerated-wheel-check
          release_wheels=(dist/*.whl)
          test "${#release_wheels[@]}" -eq 1
          /tmp/sparse-vus-accelerated-wheel-check/bin/python -m pip install "${release_wheels[0]}[accelerate]"
      - name: Verify installed radix and active-prefix APIs and source-byte identity
        run: /tmp/sparse-vus-accelerated-wheel-check/bin/python experiments/check_installed_accelerated_package.py
      - name: Verify installed complete-tie APIs and source-byte identity
        run: /tmp/sparse-vus-accelerated-wheel-check/bin/python experiments/check_installed_tie_runs.py
      - name: Verify installed sampling and integer-certificate APIs
        run: /tmp/sparse-vus-accelerated-wheel-check/bin/python experiments/check_installed_sampling.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-python-distributions
          path: dist/*
          if-no-files-found: error
